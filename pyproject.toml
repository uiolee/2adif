[project]
name = "2adif"
version = "0.2.1"
description = "Convert table to ADIF format."
readme = "README.md"
authors = [
    { name = "uiolee" }
]
requires-python = ">=3.15"
dependencies = [
    "scrapy>=2.19.0",
]
keywords = ["ADIF", "csv", "hamradio"]
license = { text = "MPL 2.0" }

classifiers = [
    "Development Status :: 4 - Beta",

    "Environment :: Console",

    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",

    "Topic :: File Formats",
    "Topic :: Utilities",

    "Natural Language :: English",

    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",

    "Programming Language :: Python :: 3.15",
]

[project.urls]
source = "https://github.com/uiolee/2adif.git"
issues = "https://github.com/uiolee/2adif/issues"

[project.scripts]
2adif = "toadif:cli.cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["toadif"]
